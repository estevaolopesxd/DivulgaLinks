# ═══════════════════════════════════════════════════════════════════════
#  DivulgaLinks — Docker Compose
# ═══════════════════════════════════════════════════════════════════════
#
#  COMANDOS:
#
#  ▶ Só a aplicação (frontend + backend + banco):
#      docker-compose up -d
#
#  ▶ Aplicação + Supabase Studio (UI para gerenciar o banco):
#      docker-compose --profile studio up -d
#      Acesse: http://localhost:54323
#
#  ▶ Ver logs em tempo real:
#      docker-compose logs -f backend
#
#  ▶ Resetar tudo (apaga volumes/dados):
#      docker-compose down -v
# ═══════════════════════════════════════════════════════════════════════

services:

  # ╔═══════════════════════════════════════════════════════════════════╗
  # ║  CORE — sempre sobem com docker-compose up                       ║
  # ╚═══════════════════════════════════════════════════════════════════╝

  # ─────────────────────────────────────────────────────────────────────
  # Banco de Dados — PostgreSQL 16
  # ─────────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: divulgalinks-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-divulgalinks123}
      POSTGRES_DB: ${POSTGRES_DB:-divulgalinks}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-divulgalinks}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────
  # Redis — filas BullMQ e cache
  # ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: divulgalinks-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────
  # Backend — Node.js + Prisma
  # Roda `prisma migrate deploy` automaticamente antes de iniciar
  # ─────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: divulgalinks-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-divulgalinks123}@db:5432/${POSTGRES_DB:-divulgalinks}
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-divulgalinks123}@db:5432/${POSTGRES_DB:-divulgalinks}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters-long}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@divulgalinks.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@1234}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - whatsapp_sessions:/app/whatsapp_sessions
    ports:
      - "5001:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────
  # Frontend — React + Nginx
  # ─────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5001}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5001}
    container_name: divulgalinks-frontend
    restart: unless-stopped
    ports:
      - "7654:80"
    depends_on:
      - backend

  # ─────────────────────────────────────────────────────────────────────
  # Supabase Studio — UI visual para o banco (http://IP:54323)
  # ─────────────────────────────────────────────────────────────────────
  supabase-meta:
    image: supabase/postgres-meta:v0.96.6
    container_name: divulgalinks-meta
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-divulgalinks}
      PG_META_DB_USER: ${POSTGRES_USER:-postgres}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-divulgalinks123}

  supabase-studio:
    image: supabase/studio:2026.05.18-sha-f45a608
    container_name: divulgalinks-studio
    restart: unless-stopped
    ports:
      - "54323:3000"
    depends_on:
      db:
        condition: service_healthy
      supabase-meta:
        condition: service_started
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-divulgalinks123}
      DEFAULT_ORGANIZATION_NAME: DivulgaLinks
      DEFAULT_PROJECT_NAME: divulgalinks
      SUPABASE_URL: http://localhost
      SUPABASE_PUBLIC_URL: http://localhost
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8iLCJpYXQiOjE2NDE3NjkyMDAsImV4cCI6MTc5OTUzNTYwMH0.dc_X5iR_VP_qroESHHSJJIKCpYqYJByHViw4ih7d_v4
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UtZGVtbyIsImlhdCI6MTY0MTc2OTIwMCwiZXhwIjoxNzk5NTM1NjAwfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q
      AUTH_JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters-long}
      NEXT_PUBLIC_ENABLE_LOGS: "false"

# ─────────────────────────────────────────────────────────────────────────
# Volumes persistentes
# ─────────────────────────────────────────────────────────────────────────
volumes:
  db_data:
  redis_data:
  whatsapp_sessions:
